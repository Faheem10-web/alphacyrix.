<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Alphacyrix — Experiences Powered by Intelligence</title>
  <meta name="description" content="Alphacyrix is a premier design and AI engineering agency building transformative digital experiences, autonomous systems, and enterprise growth platforms." />
  
  <!-- Fonts & Icons: Including Syne & Plus Jakarta Sans as used on webandcrafts.com -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Syne:wght@400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  
  <link rel="stylesheet" href="style.css?v=2.5" />
</head>
<body>

  <!-- Ambient Glows -->
  <div class="ambient-glow glow-1"></div>
  <div class="ambient-glow glow-2"></div>

  <!-- Navigation Header -->
  <header class="site-header" id="siteHeader">
    <div class="header-inner container">
      <!-- Brand Logo -->
      <a href="#hero" class="brand-logo" aria-label="Alphacyrix Home">
        <img src="logo.png" alt="Alphacyrix Logo" class="logo-image" />
      </a>

      <!-- Desktop Nav Links -->
      <nav class="nav-menu" id="navMenu">
        <a href="#hero" class="nav-link active">Home</a>
        <a href="#work" class="nav-link">Work</a>
        <a href="#services" class="nav-link">Services</a>
        <a href="#about" class="nav-link">About</a>
        <a href="#careers" class="nav-link">Careers</a>
        <a href="#contact" class="nav-link">Contact</a>
      </nav>

      <!-- CTA Action -->
      <div class="header-actions">
        <button class="btn-pill-white" id="openProjectModalBtn">
          Start a project
        </button>
        <button class="mobile-toggle" id="mobileToggle" aria-label="Toggle navigation">
          <span></span>
          <span></span>
          <span></span>
        </button>
      </div>
    </div>
  </header>

  <!-- Main Hero Section -->
  <section class="hero-section" id="hero">
    <!-- Cinematic Backdrop Slides -->
    <div class="hero-backdrop">
      <div class="backdrop-image-wrapper">
        <video autoplay loop muted playsinline class="backdrop-img backdrop-video slide-bg active" id="heroBgVideo" data-bg-index="0">
          <source src="assets/hero-video.mp4" type="video/mp4" />
        </video>
        <div class="slide-video-wrap slide-bg" data-bg-index="1">
          <video loop muted playsinline class="backdrop-img backdrop-video" id="heroBgVideo3">
            <source src="assets/hero-video-3.mp4" type="video/mp4" />
          </video>
          <div class="slide-dark-gradient"></div>
        </div>
      </div>
    </div>

    <!-- Foreground Floating Content -->
    <div class="hero-foreground container">
      <div class="hero-headline-block">
        <h1 class="hero-title">
          <span class="title-line">Experiences Powered</span>
          <span class="title-line">by Intelligence</span>
        </h1>

        <div class="hero-cta-wrapper">
          <button class="btn-get-in-touch" id="heroGetInTouchBtn">
            <span class="icon-circle">
              <i class="fa-solid fa-arrow-right"></i>
            </span>
            <span class="btn-label">GET IN TOUCH</span>
          </button>
        </div>
      </div>

      <!-- Bottom Right Floating Mini-Player Showcase Widget (100% matched to reference) -->
      <div class="hero-showcase-widget" id="heroWidget">
        <div class="widget-preview-card" id="widgetPreviewCard">
          <img src="assets/tech_widget_thumb.jpg" alt="Intelligence That Adapts" class="widget-card-image" id="widgetThumbImg" />
          <div class="widget-glass-sheen"></div>
        </div>

        <!-- Sleek Slider Controls Capsule with glass feel -->
        <div class="widget-controls-capsule">
          <div class="slider-progress-capsule active" data-index="0" id="slideIndicator0">
            <div class="progress-bar-track">
              <div class="progress-bar-fill" id="progressFill0"></div>
            </div>
          </div>
          <button class="slider-dot" data-index="1" id="slideDot1" aria-label="Slide 2"></button>
          <button class="btn-pause-toggle" id="playPauseBtn" aria-label="Pause">
            <i class="fa-solid fa-pause" id="playPauseIcon"></i>
          </button>
        </div>
      </div>
    </div>

  </section>


  <!-- Interactive Project Consultation Modal -->
  <div class="modal-overlay" id="projectModal">
    <div class="modal-card">
      <button class="modal-close" id="closeProjectModal" aria-label="Close modal">
        <i class="fa-solid fa-xmark"></i>
      </button>
      <div class="modal-header">
        <div class="section-kicker"><span class="kicker-dot"></span> PROJECT INITIATION</div>
        <h3 class="modal-title">Let's Build Something Exceptional</h3>
        <p class="modal-subtitle">Select your requirements and our solutions architect will reach out.</p>
      </div>

      <form id="projectModalForm" class="modal-form">
        <div class="form-group">
          <label>Estimated Project Scope</label>
          <div class="budget-options">
            <label class="budget-pill">
              <input type="radio" name="scope" value="flagship" checked />
              <span>Flagship Platform ($50k - $150k)</span>
            </label>
            <label class="budget-pill">
              <input type="radio" name="scope" value="enterprise" />
              <span>Enterprise Transformation ($150k+)</span>
            </label>
            <label class="budget-pill">
              <input type="radio" name="scope" value="ai_poc" />
              <span>AI Prototype / POC ($25k - $50k)</span>
            </label>
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="modalName">Name</label>
            <input type="text" id="modalName" placeholder="Your name" required />
          </div>
          <div class="form-group">
            <label for="modalEmail">Email</label>
            <input type="email" id="modalEmail" placeholder="your@email.com" required />
          </div>
        </div>

        <div class="form-group">
          <label for="modalNotes">Project Summary</label>
          <textarea id="modalNotes" rows="3" placeholder="Tell us about the project goals, target audience, and launch date..."></textarea>
        </div>

        <button type="submit" class="btn-pill-white btn-modal-submit">
          Submit Project Brief
        </button>
      </form>
    </div>
  </div>

  <!-- Toast Notification -->
  <div class="toast-notification" id="toastNotification">
    <div class="toast-icon"><i class="fa-solid fa-circle-check"></i></div>
    <div class="toast-msg" id="toastMessage">Inquiry transmitted successfully!</div>
  </div>

  <script src="script.js"></script>
</body>
</html>
