<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" width="100%" height="100%">
  <defs>
    <!-- Background Loft Gradient -->
    <linearGradient id="startupLoftBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#88684D" />
      <stop offset="40%" stop-color="#5E4331" />
      <stop offset="85%" stop-color="#2B1F17" />
      <stop offset="100%" stop-color="#140E0A" />
    </linearGradient>

    <!-- Wall Poster Gradient -->
    <linearGradient id="posterBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F1F5F9" />
    </linearGradient>

    <filter id="wallShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-opacity="0.2" />
    </filter>

    <filter id="softGlowTeam" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-opacity="0.18" />
    </filter>
  </defs>

  <!-- Loft Brick / Wood Wall Environment -->
  <rect width="900" height="620" fill="url(#startupLoftBg)" />

  <!-- Background Idea Board / Poster -->
  <g transform="translate(560, 40)" filter="url(#wallShadow)">
    <rect width="280" height="270" rx="10" fill="url(#posterBg)" stroke="#CBD5E1" stroke-width="2" />
    
    <g font-family="'Plus Jakarta Sans', sans-serif" font-style="italic" fill="#1E293B" text-anchor="middle">
      <text x="140" y="60" font-size="28" font-weight="700">Ideas</text>
      <text x="140" y="115" font-size="28" font-weight="700">Products</text>
      <text x="140" y="170" font-size="28" font-weight="700">People</text>
      <text x="140" y="225" font-size="28" font-weight="700">Impact</text>
    </g>
  </g>

  <!-- Digital Presentation Display Monitor on Stand (Left Background) -->
  <g transform="translate(160, 50)" filter="url(#wallShadow)">
    <rect width="380" height="240" rx="10" fill="#0F172A" stroke="#334155" stroke-width="4" />
    <rect x="6" y="6" width="368" height="228" rx="8" fill="#FFFFFF" />

    <!-- Screen Content -->
    <text x="24" y="38" fill="#0F172A" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="700">Digital marketing</text>

    <!-- Donut Chart -->
    <circle cx="300" cy="80" r="34" fill="none" stroke="#E2E8F0" stroke-width="12" />
    <circle cx="300" cy="80" r="34" fill="none" stroke="#0284C7" stroke-width="12" stroke-dasharray="140 220" transform="rotate(-90 300 80)" />
    <circle cx="300" cy="80" r="34" fill="none" stroke="#F59E0B" stroke-width="12" stroke-dasharray="40 220" stroke-dashoffset="-140" transform="rotate(-90 300 80)" />

    <!-- Bar Chart -->
    <g transform="translate(24, 60)">
      <line x1="0" y1="50" x2="160" y2="50" stroke="#E2E8F0" />
      <rect x="10" y="30" width="14" height="20" rx="2" fill="#0284C7" />
      <rect x="32" y="20" width="14" height="30" rx="2" fill="#0284C7" />
      <rect x="54" y="12" width="14" height="38" rx="2" fill="#0284C7" />
      <rect x="76" y="4" width="14" height="46" rx="2" fill="#38BDF8" />
    </g>

    <!-- Bottom Line Trend -->
    <path d="M24 165 Q80 130 140 145 T260 120 T350 135" fill="none" stroke="#0284C7" stroke-width="3" stroke-linecap="round" />
  </g>

  <!-- Collaborative Team (Foreground Characters) -->
  <!-- Character 1: Female Engineer with Laptop (Left) -->
  <g transform="translate(60, 200)" filter="url(#softGlowTeam)">
    <circle cx="90" cy="60" r="30" fill="#F8CBA6" />
    <path d="M55 50 C55 15 80 10 105 10 C125 10 130 25 130 45 Z" fill="#18181B" />
    <path d="M40 190 C45 130 70 100 100 100 C130 100 155 130 160 190 L180 420 L20 420 Z" fill="#0F172A" />
  </g>

  <!-- Character 2: Startup Founder Standing & Gesturing (Center) -->
  <g transform="translate(310, 130)" filter="url(#softGlowTeam)">
    <circle cx="90" cy="50" r="30" fill="#F8CBA6" />
    <path d="M60 40 C60 15 80 10 105 10 C125 10 130 20 130 35 Z" fill="#3E2723" />
    <!-- Blue Collared Shirt -->
    <path d="M35 170 C40 115 65 90 95 90 C125 90 150 115 155 170 L175 490 L15 490 Z" fill="#1E3A8A" />
    <!-- Arm leaning on table -->
    <path d="M50 170 Q30 230 40 310" fill="none" stroke="#1E3A8A" stroke-width="24" stroke-linecap="round" />
  </g>

  <!-- Character 3: Product Strategist Smiling (Right) -->
  <g transform="translate(560, 200)" filter="url(#softGlowTeam)">
    <circle cx="90" cy="60" r="30" fill="#F8CBA6" />
    <path d="M60 45 C60 20 80 15 105 15 C125 15 130 25 130 40 Z" fill="#18181B" />
    <path d="M40 190 C45 130 70 105 100 105 C130 105 155 130 160 190 L180 420 L20 420 Z" fill="#334155" />
  </g>

  <!-- Modern Wooden Conference Table & Laptops (Bottom) -->
  <g transform="translate(0, 430)">
    <!-- Wooden Table Top -->
    <rect width="900" height="190" fill="#785942" />
    <rect y="0" width="900" height="6" fill="#A47E5F" />

    <!-- Coffee Mug on Table -->
    <g transform="translate(480, 25)">
      <rect width="22" height="32" rx="4" fill="#FFFFFF" />
      <path d="M22 8 Q30 16 22 24" fill="none" stroke="#FFFFFF" stroke-width="3" />
    </g>

    <!-- Laptop 1 (Left) -->
    <g transform="translate(130, 20)">
      <polygon points="20,10 160,10 140,85 0,85" fill="#CBD5E1" />
      <polygon points="24,14 156,14 138,81 4,81" fill="#0284C7" />
      <polygon points="-20,85 160,85 190,105 -50,105" fill="#94A3B8" />
    </g>

    <!-- Laptop 2 (Center-Right) -->
    <g transform="translate(410, 15)">
      <polygon points="20,10 170,10 150,85 0,85" fill="#E2E8F0" />
      <polygon points="24,14 166,14 148,81 4,81" fill="#1E293B" />
      <polygon points="-20,85 170,85 200,105 -50,105" fill="#64748B" />
    </g>

    <!-- Small Tablet (Right) -->
    <g transform="translate(680, 40)">
      <polygon points="10,0 100,0 85,55 0,55" fill="#1E293B" stroke="#64748B" stroke-width="1.5" />
      <polygon points="14,4 96,4 82,51 4,51" fill="#0EA5E9" />
    </g>
  </g>
</svg>
