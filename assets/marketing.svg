<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" width="100%" height="100%">
  <defs>
    <!-- Background Office Gradient -->
    <linearGradient id="bgOffice" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#785942"/>
      <stop offset="30%" stop-color="#543C2E"/>
      <stop offset="70%" stop-color="#2D211B"/>
      <stop offset="100%" stop-color="#18120F"/>
    </linearGradient>

    <!-- Display Screen Gradient -->
    <linearGradient id="screenBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F3F6FA"/>
    </linearGradient>

    <linearGradient id="primaryBarGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#0369A1"/>
    </linearGradient>

    <linearGradient id="accentBarGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>

    <linearGradient id="donutMain" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#0EA5E9"/>
    </linearGradient>

    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-opacity="0.25"/>
    </filter>

    <filter id="uiGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feComposite in="SourceGraphic" in2="b" operator="over"/>
    </filter>
  </defs>

  <!-- Background Environment -->
  <rect width="900" height="620" fill="url(#bgOffice)" />

  <!-- Warm ambient light glow -->
  <circle cx="200" cy="180" r="280" fill="#FFAA5B" opacity="0.12" filter="url(#uiGlow)" />
  <circle cx="750" cy="450" r="200" fill="#38BDF8" opacity="0.08" filter="url(#uiGlow)" />

  <!-- Presentation Display Screen (Digital Marketing Dashboard) -->
  <g transform="translate(190, 45)" filter="url(#softShadow)">
    <!-- Stand / Mount -->
    <rect x="300" y="380" width="36" height="120" fill="#1E293B"/>
    <polygon points="230,500 410,500 430,515 210,515" fill="#0F172A"/>

    <!-- Screen Bezel -->
    <rect width="640" height="390" rx="14" fill="#0F172A" stroke="#334155" stroke-width="4"/>
    <!-- Inner Screen -->
    <rect x="8" y="8" width="624" height="374" rx="10" fill="url(#screenBg)"/>

    <!-- Screen Header -->
    <text x="36" y="52" fill="#0F172A" font-family="'Plus Jakarta Sans', sans-serif" font-size="24" font-weight="700">Digital marketing</text>
    
    <!-- Top-Right Sparkline Box -->
    <g transform="translate(480, 24)">
      <rect width="105" height="38" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
      <path d="M12 26 L32 16 L52 22 L72 10 L92 12" fill="none" stroke="#0284C7" stroke-width="2.5" stroke-linecap="round"/>
      <circle cx="92" cy="12" r="3.5" fill="#0284C7"/>
    </g>

    <!-- Bar Chart Grid -->
    <g transform="translate(36, 80)">
      <line x1="0" y1="25" x2="310" y2="25" stroke="#E2E8F0" stroke-dasharray="3 3"/>
      <line x1="0" y1="65" x2="310" y2="65" stroke="#E2E8F0" stroke-dasharray="3 3"/>
      <line x1="0" y1="105" x2="310" y2="105" stroke="#E2E8F0" stroke-dasharray="3 3"/>
      <line x1="0" y1="135" x2="310" y2="135" stroke="#CBD5E1" stroke-width="1.5"/>

      <!-- Bars -->
      <rect x="15" y="90" width="18" height="45" rx="3" fill="url(#primaryBarGrad)"/>
      <rect x="48" y="70" width="18" height="65" rx="3" fill="url(#primaryBarGrad)"/>
      <rect x="81" y="50" width="18" height="85" rx="3" fill="url(#primaryBarGrad)"/>
      <rect x="114" y="35" width="18" height="100" rx="3" fill="url(#primaryBarGrad)"/>
      <rect x="147" y="25" width="18" height="110" rx="3" fill="url(#accentBarGrad)"/>
      <rect x="180" y="15" width="18" height="120" rx="3" fill="url(#accentBarGrad)"/>
      <rect x="213" y="8" width="18" height="127" rx="3" fill="url(#accentBarGrad)"/>
      <rect x="246" y="2" width="18" height="133" rx="3" fill="url(#accentBarGrad)"/>
    </g>

    <!-- Donut Chart -->
    <g transform="translate(460, 150)">
      <circle cx="65" cy="0" r="54" fill="none" stroke="#E2E8F0" stroke-width="20"/>
      <circle cx="65" cy="0" r="54" fill="none" stroke="url(#donutMain)" stroke-width="20" stroke-dasharray="240 340" stroke-dashoffset="60" transform="rotate(-90 65 0)"/>
      <circle cx="65" cy="0" r="54" fill="none" stroke="#F59E0B" stroke-width="20" stroke-dasharray="60 340" stroke-dashoffset="-180" transform="rotate(-90 65 0)"/>
    </g>

    <!-- Area Curve Chart -->
    <g transform="translate(36, 255)">
      <path d="M0 65 Q60 25, 120 45 T240 15 T320 28 L320 80 L0 80 Z" fill="rgba(2, 132, 199, 0.12)"/>
      <path d="M0 65 Q60 25, 120 45 T240 15 T320 28" fill="none" stroke="#0284C7" stroke-width="3.5" stroke-linecap="round"/>
    </g>

    <!-- Side Metrics List -->
    <g transform="translate(390, 245)" font-family="'Plus Jakarta Sans', sans-serif">
      <text x="0" y="18" fill="#64748B" font-size="13">Brand Growth</text>
      <text x="175" y="18" fill="#0F172A" font-size="13" font-weight="700">+68%</text>
      <line x1="0" y1="28" x2="215" y2="28" stroke="#E2E8F0"/>

      <text x="0" y="52" fill="#64748B" font-size="13">Audience Reach</text>
      <text x="175" y="52" fill="#0F172A" font-size="13" font-weight="700">+52%</text>
      <line x1="0" y1="62" x2="215" y2="62" stroke="#E2E8F0"/>

      <text x="0" y="86" fill="#64748B" font-size="13">Conversion Rate</text>
      <text x="175" y="86" fill="#0F172A" font-size="13" font-weight="700">+38%</text>
    </g>
  </g>

  <!-- Presenter & Business Team (Foreground Silhouettes / Illustrated) -->
  <!-- Main Presenter in Suit -->
  <g transform="translate(70, 160)" filter="url(#softShadow)">
    <!-- Suit Body -->
    <path d="M80 180 C90 120 130 90 170 90 C210 90 250 120 260 180 L300 460 L40 460 Z" fill="#1E293B"/>
    <!-- White Shirt & Blue Tie -->
    <polygon points="150,110 170,180 190,110" fill="#FFFFFF"/>
    <polygon points="166,120 174,120 172,180 168,180" fill="#0284C7"/>
    
    <!-- Face / Head -->
    <circle cx="170" cy="40" r="32" fill="#F8CBA6"/>
    <!-- Hair -->
    <path d="M140 35 C140 10 160 0 180 0 C205 0 210 15 210 30 C195 20 180 20 165 25 Z" fill="#3E2723"/>
    
    <!-- Arm pointing actively to screen -->
    <path d="M230 150 Q310 115 410 85" fill="none" stroke="#1E293B" stroke-width="26" stroke-linecap="round"/>
    <circle cx="420" cy="82" r="14" fill="#F8CBA6"/>
  </g>

  <!-- Female Colleague with Laptop (Left) -->
  <g transform="translate(10, 240)">
    <circle cx="70" cy="50" r="26" fill="#D79E78"/>
    <path d="M45 45 C45 15 65 10 90 10 C105 10 110 25 110 40 Z" fill="#18181B"/>
    <path d="M30 150 C40 100 65 85 90 85 C115 85 135 100 145 150 L160 380 L10 380 Z" fill="#0F172A"/>
  </g>

  <!-- Laptops & Conference Table (Bottom Foreground) -->
  <g transform="translate(0, 480)">
    <!-- Table surface -->
    <rect width="900" height="140" fill="#3E2C22"/>
    <rect y="0" width="900" height="6" fill="#5C4234"/>

    <!-- Laptop 1 (Left) -->
    <g transform="translate(120, 10)">
      <polygon points="20,10 160,10 140,85 0,85" fill="#CBD5E1"/>
      <polygon points="24,14 156,14 138,81 4,81" fill="#0284C7"/>
      <polygon points="-20,85 160,85 190,105 -50,105" fill="#94A3B8"/>
    </g>

    <!-- Laptop 2 (Right) -->
    <g transform="translate(620, 15)">
      <polygon points="10,10 130,10 115,75 0,75" fill="#E2E8F0"/>
      <polygon points="14,14 126,14 112,71 4,71" fill="#1E293B"/>
      <polygon points="-15,75 130,75 150,92 -35,92" fill="#64748B"/>
    </g>
  </g>
</svg>
