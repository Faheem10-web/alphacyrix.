<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" width="100%" height="100%">
  <defs>
    <linearGradient id="infraBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1A2234"/>
      <stop offset="50%" stop-color="#0E1524"/>
      <stop offset="100%" stop-color="#070A10"/>
    </linearGradient>

    <!-- Siri Glowing Orb Radial Gradients -->
    <radialGradient id="siriOrbAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF2D55"/>
      <stop offset="30%" stop-color="#AF52DE"/>
      <stop offset="65%" stop-color="#007AFF"/>
      <stop offset="100%" stop-color="#5856D6" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="siriCoreGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="25%" stop-color="#FF6482"/>
      <stop offset="60%" stop-color="#9333EA"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </radialGradient>

    <filter id="neonBlur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="glowSubtle" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="900" height="620" fill="url(#infraBg)" />

  <!-- Monitor Display Window -->
  <g transform="translate(35, 30)">
    <!-- Monitor Outer Shell -->
    <rect width="830" height="560" rx="20" fill="#0C101A" stroke="#253046" stroke-width="2"/>

    <!-- Top Navigation Bar -->
    <g transform="translate(24, 22)">
      <circle cx="12" cy="12" r="7" fill="#3B82F6" opacity="0.9"/>
      <circle cx="34" cy="12" r="7" fill="#475569" opacity="0.5"/>
      <circle cx="56" cy="12" r="7" fill="#475569" opacity="0.3"/>

      <!-- Right Header -->
      <text x="600" y="16" fill="#F8FAFC" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="700">Personal Cognition</text>
      <circle cx="740" cy="12" r="10" fill="url(#siriOrbAura)" filter="url(#glowSubtle)"/>
    </g>

    <line x1="0" y1="58" x2="830" y2="58" stroke="#1E293B" stroke-width="1.5"/>

    <!-- Left Column: Voice AI Assistant Core -->
    <g transform="translate(35, 80)">
      <!-- Siri Glowing Orb Animation representation -->
      <g transform="translate(190, 65)">
        <circle cx="0" cy="0" r="64" fill="url(#siriOrbAura)" opacity="0.6" filter="url(#neonBlur)"/>
        <circle cx="0" cy="0" r="42" fill="url(#siriCoreGrad)" filter="url(#glowSubtle)"/>
        <!-- Inner wave swirls -->
        <ellipse rx="36" ry="12" cx="0" cy="0" fill="none" stroke="#FFFFFF" stroke-width="2.5" opacity="0.85" transform="rotate(-35)"/>
        <ellipse rx="28" ry="8" cx="0" cy="0" fill="none" stroke="#67E8F9" stroke-width="2" opacity="0.9" transform="rotate(45)"/>
      </g>

      <!-- Typography -->
      <text x="190" y="160" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-size="17" font-weight="700" text-anchor="middle">Transform Your Data into a Voice AI</text>
      <text x="190" y="185" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-size="17" font-weight="700" text-anchor="middle">Knowledge Assistant with Siri</text>

      <text x="190" y="218" fill="#64748B" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" text-anchor="middle">Ask, summarise or generate content from your knowledge base.</text>
      <text x="190" y="234" fill="#64748B" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" text-anchor="middle">Nothing will be made up from thin air.</text>

      <!-- Action Prompt Pills -->
      <g transform="translate(0, 260)" font-family="'Plus Jakarta Sans', sans-serif">
        <rect width="380" height="42" rx="10" fill="#151E2E" stroke="#28354D" stroke-width="1.2"/>
        <text x="36" y="26" fill="#94A3B8" font-size="12">Help me write ...</text>
        <text x="350" y="26" fill="#64748B" font-size="14">›</text>

        <rect y="52" width="380" height="42" rx="10" fill="#151E2E" stroke="#28354D" stroke-width="1.2"/>
        <text x="36" y="78" fill="#94A3B8" font-size="12">How does ... work?</text>
        <text x="350" y="78" fill="#64748B" font-size="14">›</text>

        <rect y="104" width="380" height="42" rx="10" fill="#151E2E" stroke="#28354D" stroke-width="1.2"/>
        <text x="36" y="130" fill="#94A3B8" font-size="12">What were the main insights from ...</text>
        <text x="350" y="130" fill="#64748B" font-size="14">›</text>
      </g>
    </g>

    <!-- Center Vertical Divider -->
    <line x1="475" y1="75" x2="475" y2="520" stroke="#1E293B" stroke-width="1.5"/>

    <!-- Right Column: Settings & Model Architecture -->
    <g transform="translate(515, 80)" font-family="'Plus Jakarta Sans', sans-serif">
      <text x="0" y="20" fill="#64748B" font-size="11" font-weight="700" letter-spacing="0.08em">GENERAL KNOWLEDGE</text>

      <!-- GPT-4 Row -->
      <g transform="translate(0, 44)">
        <circle cx="6" cy="12" r="4" fill="#3B82F6"/>
        <text x="20" y="16" fill="#E2E8F0" font-size="13" font-weight="600">GPT-4o</text>
        <rect x="220" y="2" width="40" height="22" rx="11" fill="#3B82F6"/>
        <circle cx="248" cy="13" r="8" fill="#FFFFFF"/>
      </g>

      <!-- BERT Row -->
      <g transform="translate(0, 88)">
        <circle cx="6" cy="12" r="4" fill="#64748B"/>
        <text x="20" y="16" fill="#E2E8F0" font-size="13" font-weight="600">BERT</text>
        <rect x="220" y="2" width="40" height="22" rx="11" fill="#334155"/>
        <circle cx="232" cy="13" r="8" fill="#94A3B8"/>
      </g>

      <!-- Llama Row -->
      <g transform="translate(0, 132)">
        <circle cx="6" cy="12" r="4" fill="#3B82F6"/>
        <text x="20" y="16" fill="#E2E8F0" font-size="13" font-weight="600">Llama-3</text>
        <rect x="220" y="2" width="40" height="22" rx="11" fill="#3B82F6"/>
        <circle cx="248" cy="13" r="8" fill="#FFFFFF"/>
      </g>

      <line x1="0" y1="180" x2="275" y2="180" stroke="#1E293B"/>

      <!-- Integrations Section -->
      <text x="0" y="214" fill="#64748B" font-size="11" font-weight="700" letter-spacing="0.08em">ECOSYSTEM INTEGRATIONS</text>

      <g transform="translate(0, 235)" font-size="13">
        <!-- Notion -->
        <text x="0" y="18" fill="#CBD5E1">Notion</text>
        <rect x="200" y="2" width="75" height="24" rx="6" fill="#3B82F6"/>
        <text x="218" y="18" fill="#FFFFFF" font-size="11" font-weight="700">Manage</text>

        <!-- Google Drive -->
        <text x="0" y="56" fill="#CBD5E1">Google Drive</text>
        <rect x="200" y="40" width="75" height="24" rx="6" fill="#182234" stroke="#334155" stroke-width="1"/>
        <text x="214" y="56" fill="#94A3B8" font-size="11">Connect</text>

        <!-- Asana -->
        <text x="0" y="94" fill="#CBD5E1">Asana</text>
        <rect x="200" y="78" width="75" height="24" rx="6" fill="#182234" stroke="#334155" stroke-width="1"/>
        <text x="214" y="94" fill="#94A3B8" font-size="11">Connect</text>

        <!-- Jira -->
        <text x="0" y="132" fill="#CBD5E1">Jira</text>
        <rect x="200" y="116" width="75" height="24" rx="6" fill="#182234" stroke="#334155" stroke-width="1"/>
        <text x="222" y="132" fill="#94A3B8" font-size="11">Sync</text>
      </g>
    </g>
  </g>
</svg>
